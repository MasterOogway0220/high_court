name: Android demo build

# Builds an installable APK for the GHCBA member app and attaches it to a
# GitHub Release, so a demo link is a URL rather than a file someone emails.
#
#   • Push a tag like `mobile-v1` → a Release with the APK appears.
#   • Or run it by hand from the Actions tab → download the artifact.
#
# The APK is signed with Flutter's debug key. That is fine for sideloading a
# demo and useless for the Play Store, which needs a real upload key — set one
# up before any store submission.

on:
  push:
    tags: ['mobile-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true

      - run: flutter pub get

      # The checks that already pass locally, kept honest on every build.
      - run: flutter analyze
      - run: flutter test

      - name: Build APK
        run: |
          # Only pass a --dart-define when the secret actually holds something.
          #
          # An empty --dart-define=KEY= still DEFINES the key, and Dart's
          # String.fromEnvironment then returns '' rather than the compiled-in
          # default. Passing them unconditionally shipped an APK with no
          # Supabase URL and no key at all — it could not reach the backend, so
          # the demo auto-login failed and the sign-in gate appeared instead.
          defines=""
          [ -n "$SUPABASE_URL" ] && defines="$defines --dart-define=SUPABASE_URL=$SUPABASE_URL"
          [ -n "$SUPABASE_ANON_KEY" ] && defines="$defines --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
          echo "extra defines: ${defines:-(none — using lib/data.dart defaults)}"
          flutter build apk --release $defines
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: ghcba-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
          body: |
            GHCBA member app — Android demo build.

            Download `app-release.apk` and install it. Android will warn about
            an unknown source; that is expected for a build outside the Play
            Store. Sign in with the enrolment number and password issued by the
            Association office.
