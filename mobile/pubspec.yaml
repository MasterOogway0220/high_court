name: ghcba
description: "Guwahati High Court Bar Association — member app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  intl: ^0.19.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    # Body — Inter stands in for SF, which is not licensable off-platform.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
    # Figures and eyebrow labels only — the dot-matrix voice.
    - family: Doto
      fonts:
        - asset: assets/fonts/Doto-600.ttf
          weight: 600
        - asset: assets/fonts/Doto-700.ttf
          weight: 700
