<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GHCBA · Mobile demo</title>
<style>
  :root { color-scheme: light dark; --w: 390px; --h: 844px; }
  body {
    margin: 0; min-height: 100dvh; display: grid; place-content: center; gap: 1.25rem;
    font: 500 13px/1.4 ui-sans-serif, system-ui, sans-serif;
    background: radial-gradient(120% 90% at 50% 0%, #f6f5f2, #e6e4de);
    color: #57534e;
  }
  @media (prefers-color-scheme: dark) {
    body { background: radial-gradient(120% 90% at 50% 0%, #26241f, #131211); color: #a8a29e; }
  }
  /* Phone shell: the bezel is padding. No notch — the app draws no safe-area
     inset, so an island would sit on top of the search bar. */
  .phone {
    padding: 12px; border-radius: 56px; background: #1c1917;
    box-shadow: 0 0 0 2px #3f3b36, 0 30px 60px -20px rgb(0 0 0 / .55);
  }
  iframe {
    display: block; width: var(--w); height: var(--h);
    border: 0; border-radius: 44px; background: #fff;
  }
  p { margin: 0; text-align: center; }
  a { color: inherit; }
  /* Shrink to fit short laptop screens rather than clipping the phone. */
  @media (max-height: 940px) { .phone { scale: .86; margin: -60px 0; } }
  @media (max-height: 800px) { .phone { scale: .74; margin: -110px 0; } }
</style>

<div class="phone"><iframe src="/" title="GHCBA member app"></iframe></div>
<p>Guwahati High Court Bar Association — mobile view · <a href="/">open full size</a></p>
